name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (e.g. v1.0.0). Leave empty for a test build only."
        required: false
        default: ""

env:
  RELEASE_VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DLUMEN_BUILD_TESTS=ON ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run DSP tests
        if: runner.os == 'Linux'
        run: xvfb-run ./build/LumenEQTests_artefacts/Release/LumenEQTests

      - name: Package
        shell: bash
        run: |
          VERSION="${RELEASE_VERSION:-dev}"
          mkdir -p dist
          cd build/LumenEQ_artefacts/Release
          ITEMS="VST3 Standalone"
          [[ -d AU ]] && ITEMS="$ITEMS AU"
          cmake -E tar cf "$GITHUB_WORKSPACE/dist/LumenEQ-${VERSION}-${{ matrix.name }}.zip" --format=zip $ITEMS

      - uses: actions/upload-artifact@v4
        with:
          name: LumenEQ-${{ matrix.name }}
          path: dist/*.zip

  release:
    if: inputs.version != '' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Lumen EQ ${{ env.RELEASE_VERSION }}
          files: dist/*.zip
          body: |
            Lumen EQ ${{ env.RELEASE_VERSION }} by GCC Labs.

            **Downloads**
            - **Windows**: `LumenEQ-${{ env.RELEASE_VERSION }}-Windows.zip` (VST3 + standalone)
            - **macOS** (Apple Silicon + Intel): `LumenEQ-${{ env.RELEASE_VERSION }}-macOS.zip` (VST3 + AU + standalone)
            - **Linux**: `LumenEQ-${{ env.RELEASE_VERSION }}-Linux.zip` (VST3 + standalone)

            **Install**
            - Windows: copy `Lumen EQ.vst3` to `C:\Program Files\Common Files\VST3`
            - macOS: copy `Lumen EQ.vst3` to `~/Library/Audio/Plug-Ins/VST3` and `Lumen EQ.component` to `~/Library/Audio/Plug-Ins/Components`.
              The build is not notarized, so run `xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/"Lumen EQ.vst3" ~/Library/Audio/Plug-Ins/Components/"Lumen EQ.component"` once.
            - Linux: copy `Lumen EQ.vst3` to `~/.vst3`

            Then rescan plugins in your DAW.
