name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DLUMEN_BUILD_TESTS=ON ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run DSP tests
        if: runner.os == 'Linux'
        run: xvfb-run ./build/LumenEQTests_artefacts/Release/LumenEQTests

      - uses: actions/upload-artifact@v4
        with:
          name: LumenEQ-${{ runner.os }}
          path: |
            build/LumenEQ_artefacts/Release/VST3
            build/LumenEQ_artefacts/Release/AU
            build/LumenEQ_artefacts/Release/Standalone
